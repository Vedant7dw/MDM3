<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>

        <!-- Feedback Messages -->
        <div id="alert-container"></div>

        <!-- Add/Edit Form -->
        <div class="card">
            <h2 id="form-title">Add Student Record</h2>
            <form id="student-form">
                <input type="hidden" id="student-id">
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="roll_no">Roll Number</label>
                    <input type="text" id="roll_no" required placeholder="CS101">
                </div>

                <div class="form-group">
                    <label for="class_name">Class / Division</label>
                    <input type="text" id="class_name" required placeholder="BS-CS-3A">
                </div>

                <div class="form-group">
                    <label for="marks">Marks (%)</label>
                    <input type="number" step="0.01" id="marks" min="0" max="100" required placeholder="85.5">
                </div>

                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input type="tel" id="contact" required placeholder="10-digit phone number">
                </div>

                <div class="button-group">
                    <button type="submit" id="submit-btn">Save Record</button>
                    <button type="button" id="cancel-btn" style="display: none;">Cancel Edit</button>
                </div>
            </form>
        </div>

        <!-- Search Bar -->
        <div class="card search-card">
            <h2>Student Directory</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search by name or roll number...">
                <button type="button" id="search-btn">Search</button>
                <button type="button" id="reset-btn">Reset</button>
            </div>
        </div>

        <!-- Student Records Table -->
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>Class</th>
                        <th>Marks</th>
                        <th>Contact</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-table-body">
                    <!-- Dynamic Rows Rendered Here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
